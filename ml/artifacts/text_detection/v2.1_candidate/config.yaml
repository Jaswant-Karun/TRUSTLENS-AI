# TRUSTLENS AI - Phase 2.1 Multilingual Text Scam Classifier Configuration
dataset:
  version: "2.0.5"
  train_path: "data/processed/text_train.parquet"
  val_path: "data/processed/text_val.parquet"
  test_path: "data/processed/text_test.parquet"
  manifest_path: "data/processed/dataset_manifest.json"
  text_column: "cleaned_text"
  label_column: "canonical_label"

random_seed: 42

labels:
  0: "legitimate"
  1: "spam"
  2: "smishing"
  3: "scam"

artifacts:
  output_dir: "ml/artifacts/text_detection/v2.1_candidate"
  preserve_existing_production: true

models:
  word_tfidf_logreg:
    display_name: "Word TF-IDF (1-2) + Logistic Regression"
    word_ngram_range: [1, 2]
    max_features: 50000
    sublinear_tf: true
    C: 1.0
    class_weight: "balanced"
    max_iter: 1000

  char_tfidf_logreg:
    display_name: "Char_wb TF-IDF (3-5) + Logistic Regression"
    char_ngram_range: [3, 5]
    max_features: 60000
    sublinear_tf: true
    C: 1.0
    class_weight: "balanced"
    max_iter: 1000

  union_tfidf_linearsvc:
    display_name: "Word+Char FeatureUnion TF-IDF + Calibrated LinearSVC"
    word_ngram_range: [1, 3]
    char_ngram_range: [2, 5]
    word_max_features: 40000
    char_max_features: 40000
    sublinear_tf: true
    C: 1.0
    class_weight: "balanced"
    calibration_cv: 3
    max_iter: 3000
